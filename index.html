// управление
let stickId=null,sx=0,sy=0,jx=0,jy=0,lookId=null,lx=0,ly=0;
function look(dx,dy,k){k*=(SET.sens||1)*cam.fov/72;yaw-=dx*k;pitch=clamp(pitch-dy*k,-1.3,1.3)}
const L=$("look"),ring=$("ring"),knob=$("knob");
L.addEventListener("pointerdown",e=>{if(state!=="play")return;
if(e.pointerType==="mouse"){L.requestPointerLock&&L.requestPointerLock();return}
L.setPointerCapture(e.pointerId);
if(SET.lh?e.clientX>innerWidth*.55:e.clientX<innerWidth*.45){if(stickId===null){stickId=e.pointerId;sx=e.clientX;sy=e.clientY;ring.style.cssText="display:block;left:"+sx+"px;top:"+sy+"px";knob.style.cssText="display:block;left:"+sx+"px;top:"+sy+"px"}}
else if(lookId===null){lookId=e.pointerId;lx=e.clientX;ly=e.clientY}});
L.addEventListener("pointermove",e=>{
if(e.pointerId===stickId){let dx=e.clientX-sx,dy=e.clientY-sy;const m=Math.hypot(dx,dy),r=50;if(m>r){dx*=r/m;dy*=r/m}jx=dx/r;jy=dy/r;knob.style.left=sx+dx+"px";knob.style.top=sy+dy+"px"}
else if(e.pointerId===lookId){look(e.clientX-lx,e.clientY-ly,.0055);lx=e.clientX;ly=e.clientY}});
const up=e=>{if(e.pointerId===stickId){stickId=null;jx=jy=0;ring.style.display=knob.style.display="none"}if(e.pointerId===lookId)lookId=null};
L.addEventListener("pointerup",up);L.addEventListener("pointercancel",up);
document.addEventListener("mousemove",e=>{if(document.pointerLockElement===L&&state==="play")look(e.movementX,e.movementY,.0025)});
document.addEventListener("mousedown",e=>{if(document.pointerLockElement===L&&e.button===0)firing=true});
document.addEventListener("mouseup",()=>{if(document.pointerLockElement===L)firing=false});

addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
